name: Build Needle 3 Telegram Agent APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Bundle Official Cactus Compute Needle 3 Android ARM64 Engine
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          curl -fL --retry 3 "https://huggingface.co/Cactus-Compute/needle3/resolve/main/android-arm64/needle" -o app/src/main/jniLibs/arm64-v8a/libneedle_exec.so || true
          curl -fL --retry 3 "https://huggingface.co/Cactus-Compute/needle3/resolve/main/android-arm64/needle.h" -o app/src/main/cpp/needle.h || true

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compile Debug APK
        run: |
          gradle assembleDebug -x lint --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk Needle3-Telegram-Agent.apk
          ls -lh Needle3-Telegram-Agent.apk

      - name: Upload Ready-to-Install APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Needle3-Telegram-Agent-APK
          path: Needle3-Telegram-Agent.apk
          if-no-files-found: error

      - name: Publish Direct APK Download to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Needle 3 Telegram Agent APK (build ${{ github.run_number }})"
          body: "Tap **Needle3-Telegram-Agent.apk** below under Assets to download and install directly on your Android phone (no unzip required)."
          files: Needle3-Telegram-Agent.apk
          make_latest: true
